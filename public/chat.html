<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Homing Pigeons - Real-time chat room. Connect and communicate in your room.">
  <title>Homing Pigeons | Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Theme script runs synchronously to prevent flash of wrong theme -->
  <script src="/js/theme.js"></script>
  <!-- Emoji Picker web component -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  <!-- Dependencies -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>
  <script defer src="../socket.io/socket.io.js"></script>
  <script defer src="/js/script.js"></script>
</head>

<body>
  <div class="chat-shell">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-brand">
          <div class="brand-icon" style="background: transparent; box-shadow: none;">
            <img src="/img/pigeon-logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;" />
          </div>
          <span class="brand-label">Homing Pigeons</span>
        </div>
        <button class="sidebar-close" id="sidebarClose" title="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Room Info -->
      <div class="room-info-card">
        <div class="room-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="room-info-text">
          <span class="room-label">Room</span>
          <span id="roomid" class="room-name">Loading…</span>
        </div>
        <button class="copy-room-btn" id="copyRoomBtn" title="Copy Room ID to share">
          <svg class="copy-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg class="check-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </div>

      <!-- Members -->
      <div class="members-section">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Members
          <span class="member-count" id="memberCount">0</span>
        </div>
        <ul id="users" class="members-list"></ul>
      </div>

      <!-- Leave button -->
      <div class="sidebar-footer">
        <a href="/" class="leave-btn" id="leaveBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Leave Room
        </a>
      </div>
    </aside>

    <!-- ===== MAIN CHAT AREA ===== -->
    <main class="chat-main">
      <!-- Header -->
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn" title="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="header-info">
          <div class="header-room">
            <span class="header-hash">#</span>
            <span id="headerRoomName">room</span>
          </div>
          <div class="header-user-pill">
            <div class="user-avatar-sm" id="userAvatarSm">?</div>
            <span id="headerUsername">You</span>
          </div>
        </div>
        <div class="header-actions">
          <div class="online-indicator">
            <div class="online-dot"></div>
            <span id="headerOnlineCount">0 online</span>
          </div>
          <!-- Theme toggle -->
          <button class="theme-toggle" id="themeToggle" title="Toggle light / dark mode" aria-label="Toggle theme">
            <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div id="message__area" class="message-area">
        <div class="message-area-intro">
          <div class="intro-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <p>This is the beginning of the conversation.</p>
        </div>
      </div>

      <!-- ===== EMOJI PICKER PANEL ===== -->
      <div class="picker-panel" id="emojiPanel" style="display:none">
        <emoji-picker id="emojiPicker" class="light"></emoji-picker>
      </div>

      <!-- ===== GIF PANEL ===== -->
      <div class="picker-panel gif-panel" id="gifPanel" style="display:none">
        <div class="gif-panel-header">
          <div class="gif-search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="gifSearch" placeholder="Search GIFs…" autocomplete="off" />
          </div>
          <span class="gif-powered">Powered by Tenor</span>
        </div>
        <div class="gif-grid" id="gifGrid">
          <div class="gif-loading" id="gifLoading">
            <div class="gif-spinner"></div>
            <span>Loading GIFs…</span>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <form class="input-form" id="messageForm" autocomplete="off">
          <div class="textarea-wrapper">
            <input type="text" id="textarea" placeholder="Type a message…" autocomplete="off" />
          </div>
          <div class="action-buttons">
            <!-- Emoji button -->
            <button type="button" id="emojiBtn" title="Emoji" class="icon-btn emoji-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
            <!-- GIF button -->
            <button type="button" id="gifBtn" title="Send GIF" class="icon-btn gif-btn">
              <span class="gif-label">GIF</span>
            </button>
            <!-- Location button -->
            <button type="button" id="sendLocationButton" title="Share location" class="icon-btn location-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </button>
            <!-- Send button -->
            <button type="submit" id="sendMessageButton" title="Send message" class="send-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastMsg">Copied!</span>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script>
    // ===== Sidebar toggle =====
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('visible'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('visible'); }

    menuBtn.addEventListener('click', openSidebar);
    sidebarClose.addEventListener('click', closeSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    // ===== Enter to send =====
    document.getElementById('textarea').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('sendMessageButton').click();
      }
    });

    // ===== Emoji Picker =====
    const emojiBtn   = document.getElementById('emojiBtn');
    const emojiPanel = document.getElementById('emojiPanel');
    const emojiPicker = document.getElementById('emojiPicker');
    const gifBtn     = document.getElementById('gifBtn');
    const gifPanel   = document.getElementById('gifPanel');
    const textarea   = document.getElementById('textarea');

    function closeAllPickers() {
      emojiPanel.style.display = 'none';
      gifPanel.style.display   = 'none';
    }

    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = emojiPanel.style.display !== 'none';
      closeAllPickers();
      if (!isOpen) emojiPanel.style.display = 'block';
    });

    // Insert emoji into textarea
    emojiPicker.addEventListener('emoji-click', (e) => {
      const emoji = e.detail.unicode;
      const start = textarea.selectionStart;
      const end   = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, start) + emoji + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
      textarea.focus();
    });

    // Apply theme to emoji picker
    function applyPickerTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      emojiPicker.classList.toggle('light', isLight);
      emojiPicker.classList.toggle('dark', !isLight);
    }
    applyPickerTheme();
    const themeObserver = new MutationObserver(applyPickerTheme);
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    // ===== GIF Panel =====
    const TENOR_KEY = 'LIVDSRZULELA';
    const gifGrid   = document.getElementById('gifGrid');
    const gifSearch = document.getElementById('gifSearch');
    const gifLoading = document.getElementById('gifLoading');
    let gifSearchTimer;

    gifBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = gifPanel.style.display !== 'none';
      closeAllPickers();
      if (!isOpen) {
        gifPanel.style.display = 'flex';
        loadGifs('');
      }
    });

    async function loadGifs(query) {
      gifGrid.innerHTML = '';
      gifLoading.style.display = 'flex';
      gifGrid.appendChild(gifLoading);
      try {
        const url = query
          ? `https://api.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=${TENOR_KEY}&limit=24`
          : `https://api.tenor.com/v1/trending?key=${TENOR_KEY}&limit=24`;
        const res  = await fetch(url);
        const data = await res.json();
        gifGrid.innerHTML = '';
        (data.results || []).forEach(gif => {
          const url = gif.media[0]?.tinygif?.url || gif.media[0]?.gif?.url;
          if (!url) return;
          const img = document.createElement('img');
          img.src   = url;
          img.alt   = gif.title || 'GIF';
          img.className = 'gif-thumb';
          img.loading = 'lazy';
          img.addEventListener('click', () => {
            sendGif(gif.media[0]?.gif?.url || url);
            closeAllPickers();
          });
          gifGrid.appendChild(img);
        });
        if (!gifGrid.children.length) {
          gifGrid.innerHTML = '<p class="gif-empty">No GIFs found. Try another search!</p>';
        }
      } catch(err) {
        gifGrid.innerHTML = '<p class="gif-empty">Could not load GIFs. Check your connection.</p>';
      }
    }

    gifSearch.addEventListener('input', () => {
      clearTimeout(gifSearchTimer);
      gifSearchTimer = setTimeout(() => loadGifs(gifSearch.value.trim()), 400);
    });

    function sendGif(url) {
      // script.js sendGif is available globally once deferred scripts run
      if (typeof window.sendGifMessage === 'function') {
        window.sendGifMessage(url);
      }
    }

    // Close pickers when clicking outside
    document.addEventListener('click', (e) => {
      if (!emojiPanel.contains(e.target) && e.target !== emojiBtn &&
          !gifPanel.contains(e.target) && e.target !== gifBtn) {
        closeAllPickers();
      }
    });
  </script>
</body>
</html>
